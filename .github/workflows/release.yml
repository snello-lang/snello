# Makes a release, on a tag vX.Y.Z that a maintainer pushes on the
# merge of the pull request that prepared the release, and on nothing
# else: no push, no pull request and no schedule makes one. A run
# started by hand from the Actions page is a dry run, which builds and
# checks exactly as a tag does and publishes nothing; it is how the
# workflow is tried on a fork or before a release. No version is typed
# here: release/build.sh reads it from compiler/version/version.go and
# refuses a tag that differs, and the notes refuse a changelog without
# the version's section.
#
# The archives are built twice, on the two Linux runners, one of each
# processor, since the compiler is pure Go and builds every platform
# from any; the two builds must be the same bit for bit, or nothing is
# published. Each archive is then smoke-tested on a runner of its own
# platform, a developer's first five minutes with nothing but the
# archive and the runner's clang, release/smoke.sh; a tier-1
# platform's failure publishes nothing, and windows/arm64's, tier 2,
# is recorded in the release notes. Only then are the archives
# published, with SHA256SUMS signed by Sigstore under this workflow's
# own identity, build provenance for each archive, and an SBOM for
# each; the release's notes are the changelog's newest section, then
# each archive's tier and checksum and how to verify them.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # a dry run: built and checked as a tag is, published never

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build the six archives and their checksums
        run: sh release/build.sh
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }} # held to the version in version.go; a dry run has none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  compare:
    name: the two builds are the same
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
      - name: Compare every byte
        run: diff -r dist-ubuntu-latest dist-ubuntu-24.04-arm && cat dist-ubuntu-latest/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist-ubuntu-latest/
          if-no-files-found: error

  smoke:
    # The first five minutes on each platform, from the archive alone:
    # snello doctor, snello new, then run and test through both
    # backends, release and debug; Windows with clang and lld-link
    # from LLVM's own installer, as a developer installs them.
    name: first five minutes on ${{ matrix.os }}
    needs: compare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }} # tier 2: recorded in the notes, never stopping the release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-amd64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-amd64 }
          - { os: windows-latest, platform: windows-amd64 }
          - { os: windows-11-arm, platform: windows-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install LLVM where the runner lacks it
        if: runner.os == 'Windows'
        run: |
          if ! command -v clang >/dev/null; then
            choco install llvm --yes --no-progress
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          fi
      - name: Unpack the archive and put it on the path
        run: |
          version=$(sed -n 's/^\tCurrent = "\([^"]*\)".*/\1/p' compiler/version/version.go)
          name=snello-$version-${{ matrix.platform }}
          if [ "$RUNNER_OS" != Windows ]; then tar -xzf "dist/$name.tar.gz"
          elif command -v unzip >/dev/null; then unzip -q "dist/$name.zip"
          else 7z x -y "dist/$name.zip" >/dev/null; fi
          echo "$GITHUB_WORKSPACE/$name" >> "$GITHUB_PATH" # the workspace in the system's own form, which Windows' path needs
      - name: Check the first five minutes
        run: sh release/smoke.sh
        env:
          CC: clang # the C backend's compiler on Windows, where there is no cc; harmless elsewhere
          CLANG: clang

  notes:
    # The release's notes, written on a dry run too, so that the first
    # tag is not the first time this runs: the changelog's newest
    # section, which must be the version's; then each archive's tier
    # and checksum, the smoke test of windows/arm64 when it failed in
    # this run, and how to verify what was downloaded.
    name: the notes
    needs: [compare, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the smoke jobs' conclusions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Write the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^\tCurrent = "\([^"]*\)".*/\1/p' compiler/version/version.go)
          notes=notes.md
          awk '/^## /{n++} n==1' CHANGELOG.md > "$notes"
          grep -q "^## \[$version\]" "$notes" || { echo "CHANGELOG.md's newest section is not $version's: release/prepare.sh writes it" >&2; exit 1; }
          {
            echo
            echo "## Archives"
            echo
            echo "| Platform | Tier | Archive | SHA-256 |"
            echo "|---|---|---|---|"
            while read -r sum file; do
              base=${file%.tar.gz}; base=${base%.zip}
              arch=${base##*-}; rest=${base%-*}; os=${rest##*-}
              tier=1; [ "$os/$arch" = windows/arm64 ] && tier=2
              echo "| \`$os/$arch\` | $tier | $file | \`$sum\` |"
            done < dist/SHA256SUMS
            arm=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all" --jq '[.jobs[] | select(.name | contains("windows-11-arm")) | .conclusion] | last')
            if [ -n "$arm" ] && [ "$arm" != success ]; then
              echo
              echo "The first five minutes on \`windows/arm64\`, tier 2, did not pass in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID); the archive is published as built, and the failure is fixed before the next release."
            fi
            echo
            echo "## Verifying"
            echo
            echo '```'
            echo 'sha256sum -c --ignore-missing SHA256SUMS'
            echo "cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity-regexp '^$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/\.github/workflows/release\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS # cosign 3 or later"
            echo "gh attestation verify snello-*-linux-amd64.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> "$notes"
          cat "$notes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  publish:
    name: publish
    needs: [compare, smoke, notes]
    if: github.event_name == 'push' # a dry run stops here
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release and its files
      id-token: write # Sigstore's certificate and the provenance, under this workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # every tag, to tell whether this release is the newest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Write an SBOM for each archive
        run: for f in dist/*.tar.gz dist/*.zip; do base=${f%.tar.gz}; base=${base%.zip}; syft scan "file:$f" -o "spdx-json=$base.spdx.json" --quiet; done
      - name: Publish the release
        # A draft until every file is up, since the creation and the
        # uploads are separate requests: a release with a file missing
        # is never public; a draft left by a run that failed after this
        # point is removed first, so that the run can be repeated. A
        # patch to an older minor is not marked the latest release
        # while a newer version is released, since the install script
        # reads the latest.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json isDraft --jq .isDraft | grep -q true || { echo "$tag is released already" >&2; exit 1; }
            gh release delete "$tag" --yes
          fi
          newest=$(git tag -l 'v*' | sort -V | tail -1)
          latest=true; [ "$tag" = "$newest" ] || latest=false
          gh release create "$tag" --draft --title "snello ${tag#v}" --notes-file notes.md dist/*.tar.gz dist/*.zip dist/*.spdx.json dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
          gh release edit "$tag" --draft=false --latest="$latest"
