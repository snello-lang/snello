# Runs the checks and the test suite on every push and pull request.
#
# The suite builds and runs Snello programs through both backends, and
# the runtime under them has code per processor and per system: the
# context switch is assembly for x86-64 and for arm64, the poller is
# epoll on Linux and kqueue on Darwin, and a call into the runtime
# follows each processor's C convention. Each runner covers one pair
# natively, so no part of it is tested under emulation:
#
#   ubuntu-latest      x86-64 Linux: the x86-64 switch, epoll, byval
#   ubuntu-24.04-arm   arm64 Linux: glibc's thread-locals, which a task
#                      that moves between threads must not cache
#   macos-latest       arm64 Darwin: kqueue
#
# x86-64 Darwin is the one pair no runner covers.
name: Tests

# A change to documentation alone, markdown anywhere or anything under
# _docs/, runs none of this: the lints of commit messages and pull
# request titles still run, and main is not protected by these checks,
# so a skipped run blocks nothing.
on:
  push:
    paths-ignore:
      - '**.md'
      - '_docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '_docs/**'

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: gofmt and go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # the version the compiler is built with, 1.27.2 today, read from one place
          cache-dependency-path: go.mod # the compiler has no dependencies, so no go.sum: the build cache is keyed on go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...

  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install clang
        if: runner.os == 'Linux'
        run: command -v clang || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang; }
      - name: Show the toolchain
        run: |
          clang --version
          if [ -r /proc/sys/vm/max_map_count ]; then echo "vm.max_map_count $(cat /proc/sys/vm/max_map_count)"; fi
      - name: Test
        run: go test ./... -timeout 25m
        env:
          CC: clang # the C backend's compiler, named as every build tool reads it
          CLANG: clang # the LLVM backend's

  bench:
    # The performance table, measured natively on both Linux
    # processors and written to the job's summary. A program that
    # prints the wrong thing fails the job; a time never does, since a
    # shared runner is too noisy for a time to be a test. The Mac's
    # numbers are measured by hand, bench/README.md.
    name: benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install clang
        run: command -v clang || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang; }
      - name: Time the benchmarks
        run: go test ./bench -run TestBenchmarks -v -timeout 25m
        env:
          CC: clang
          CLANG: clang
          SNELLO_BENCH: 1
          SNELLO_BENCH_OUT: ${{ runner.temp }}/bench.md
      - name: Write the table to the summary
        if: always()
        run: |
          echo "## Benchmarks on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -r "${{ runner.temp }}/bench.md" ]; then cat "${{ runner.temp }}/bench.md" >> "$GITHUB_STEP_SUMMARY"; else echo "no table: the timing did not finish" >> "$GITHUB_STEP_SUMMARY"; fi
