# Runs the checks and the test suite on every pull request, and on
# nothing else: main takes changes through a pull request alone, from
# a branch the rule holds up to date with main, so the pull request's
# run tests the tree its merge puts on main, and a run on the push to
# main would test it twice.
#
# The suite builds and runs Snello programs through both backends, and
# the runtime under them has code per processor and per system: the
# context switch is assembly for x86-64 and for arm64, the poller is
# epoll on Linux and kqueue on Darwin, and a call into the runtime
# follows each processor's C convention. Each runner covers one pair
# natively, so no part of it is tested under emulation:
#
#   ubuntu-latest      x86-64 Linux: the x86-64 switch, epoll, byval
#   ubuntu-24.04-arm   arm64 Linux: glibc's thread-locals, which a task
#                      that moves between threads must not cache
#   macos-latest       arm64 Darwin: kqueue
#   macos-15-intel     x86-64 Darwin: the x86-64 switch under Apple's
#                      convention; not blocking until its tests pass
#   windows-latest     x86-64 Windows: the Windows x64 switch and its
#                      thread block's bounds, the completion port and
#                      AFD, the Windows x64 convention
#   windows-11-arm     arm64 Windows, tier 2: its job runs every time
#                      and its failure does not fail the run
#
# The distributions job runs a developer's first five minutes on each
# Linux distribution snello doctor names a fix for, in images of their
# own on both Linux runners, as make distros runs them.
#
# The Linux jobs run inside the image build/Dockerfile describes, the
# one the Makefile's Snello targets run in on a developer's machine,
# through the same build/run.sh, so that a green run there and a green
# job here mean the same thing; the image is built from the Dockerfile
# with its layers cached by GitHub, so a run after an unchanged
# Dockerfile pays nothing for it. The macOS jobs run natively, since
# they cover kqueue, and so do the Windows jobs, with clang and
# lld-link from LLVM, against the Build Tools' SDK and C runtime, which
# clang finds by itself, and make under Git's Bash.
name: Tests

# A change that touches no code, Markdown anywhere, the design and the
# book under _docs/, the changelogs, the release's scripts and
# workflow, and Renovate's configuration, runs none of the checks: the
# first job lists what changed and answers whether code did, and every
# other job runs only then. The last job, all checks, is the one the
# branch rule requires: it waits for every other and fails when one
# failed or was cancelled, and passes when they passed or were
# skipped; the rule cannot name the matrix jobs, since a skipped matrix
# job is recorded under its unexpanded name and the names the rule
# would require never appear. The parse of every script and the lints
# of commit messages and pull request titles run on every change.
# release/archive is Go, and counts as code.
on:
  pull_request:

# Every job reads the repository and writes nothing to it.
permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: did code change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the files of a pull request, read from its API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes # a file counts when it matches a pattern and none of the negated ones; the default reads no negation
          filters: |
            code:
              - '**'
              - '!**.md'
              - '!_docs/**'
              - '!changelogs/**'
              - '!release/*.sh'
              - '!.github/workflows/release.yml'
              - '!.github/renovate.json'

  checks:
    name: gofmt and go vet
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod # the version the compiler is built with, 1.27.2 today, read from one place
          cache-dependency-path: go.mod # the compiler has no dependencies, so no go.sum: the build cache is keyed on go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...

  scripts:
    # Every shell script parses, on every change, since the install
    # scripts run only after a release is published, from main. sh,
    # dash on the runner, parses each and runs none.
    name: the shell scripts parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: sh -n each shell script
        run: |
          status=0
          for f in $(git ls-files '*.sh'); do
            sh -n "$f" || status=1
          done
          exit $status

  powershell:
    # Every PowerShell script parses, on every change, under both
    # PowerShells a Windows machine runs it with: Windows PowerShell
    # 5.1, which the one-line install promises and Windows ships, and
    # PowerShell 7.
    name: the PowerShell scripts parse
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./build/parse.ps1
      - name: PowerShell 7
        shell: pwsh
        run: ./build/parse.ps1

  test:
    name: go test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 60 || 40 }} # Windows links twice per program and scans each new binary
    continue-on-error: ${{ matrix.os == 'windows-11-arm' || matrix.os == 'macos-15-intel' }} # tier 2, or tier 1 not yet passing: run on every change, never blocking it
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash # Git's Bash on Windows, which make and the build's scripts run under
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Go version
        if: runner.os == 'Linux'
        run: echo "GO_VERSION=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: runner.os == 'Linux'
      - name: Build the image # the one the Makefile runs in, its layers cached under the Dockerfile's hash and the runner's processor
        if: runner.os == 'Linux'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: build
          build-args: GO_VERSION=${{ env.GO_VERSION }}
          tags: snello-dev
          load: true
          cache-from: type=gha,scope=${{ runner.arch }}-${{ hashFiles('build/Dockerfile') }}
          cache-to: type=gha,mode=max,scope=${{ runner.arch }}-${{ hashFiles('build/Dockerfile') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0; the Go build cache and Snello's compiled runtime the image's runs write, so a run compiles only what changed
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/snello
          key: snello-go-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: snello-go-${{ runner.arch }}-${{ hashFiles('go.mod') }}-
      - name: Test in the image
        if: runner.os == 'Linux'
        run: build/run.sh go test ./... -timeout 25m
      - name: Snello tests and checks through the Makefile # NEEDS= since the image is built above
        if: runner.os == 'Linux'
        run: make test NEEDS= && make check NEEDS=
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.os != 'Linux'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install LLVM and make where the image lacks them # clang and lld-link from LLVM's own build, as a developer installs them
        if: runner.os == 'Windows'
        run: |
          if ! command -v clang >/dev/null; then
            choco install llvm --yes --no-progress
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          fi
          if ! command -v make >/dev/null; then
            choco install make --yes --no-progress
          fi
      - name: Show the toolchain
        if: runner.os == 'Windows'
        run: clang --version && lld-link --version && make --version
      - name: Test natively
        if: runner.os != 'Linux'
        run: go test ./... -timeout 25m
        env:
          CC: clang # the C backend's compiler, named as every build tool reads it
          CLANG: clang # the LLVM backend's
      - name: Snello tests and checks through the Makefile, natively
        if: runner.os != 'Linux'
        run: make test NATIVE=1 && make check NATIVE=1
        env:
          CC: clang
          CLANG: clang

  distros:
    # A developer's first five minutes on Debian 13, Ubuntu 24.04,
    # Fedora and Arch, each in an image of its own built from the
    # distribution's base image, bare and with clang, as make distros
    # runs them; Arch publishes no arm64 image, so the arm64 runner
    # leaves it out.
    name: distributions (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            distros: debian ubuntu fedora arch
          - os: ubuntu-24.04-arm
            distros: debian ubuntu fedora
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check the first five minutes in each distribution's images
        run: make distros
        env:
          DISTROS: ${{ matrix.distros }}

  bench:
    # The performance table, measured on both Linux processors inside
    # the image and written to the job's summary. A program that
    # prints the wrong thing fails the job; a time never does, since a
    # shared runner is too noisy for a time to be a test. The Mac's
    # numbers are measured natively by hand, bench/README.md.
    name: benchmark (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Go version
        run: echo "GO_VERSION=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the image # the one the Makefile runs in, its layers cached under the Dockerfile's hash and the runner's processor
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: build
          build-args: GO_VERSION=${{ env.GO_VERSION }}
          tags: snello-dev
          load: true
          cache-from: type=gha,scope=${{ runner.arch }}-${{ hashFiles('build/Dockerfile') }}
          cache-to: type=gha,mode=max,scope=${{ runner.arch }}-${{ hashFiles('build/Dockerfile') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/snello
          key: snello-go-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: snello-go-${{ runner.arch }}-${{ hashFiles('go.mod') }}-
      - name: Time the benchmarks
        run: mkdir -p bin && build/run.sh env SNELLO_BENCH=1 SNELLO_BENCH_OUT=/src/bin/bench.md go test ./bench -run TestBenchmarks -v -timeout 25m # an absolute path, since go test runs in bench/; the repository is /src in the image
      - name: Write the table to the summary
        if: always()
        run: |
          echo "## Benchmarks on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -r bin/bench.md ]; then cat bin/bench.md >> "$GITHUB_STEP_SUMMARY"; else echo "no table: the timing did not finish" >> "$GITHUB_STEP_SUMMARY"; fi

  all:
    # The one check the branch rule requires, standing for every job
    # above: green when each passed or was skipped, red when one failed
    # or was cancelled.
    name: all checks
    needs: [changes, scripts, powershell, checks, test, distros, bench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
          echo "all checks pass"
